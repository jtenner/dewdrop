name: Native Wago transform

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'lib/dewdrop/**'
      - 'self_host/compiler/**'
      - 'self_host/starshine/**'
      - 'starshine-mb'
      - 'src/**'
      - 'std/**'
      - 'examples/transforms/**'
      - 'tools/**'
      - 'wago*.json'
      - '.github/workflows/transform-wago.yml'

permissions:
  contents: read

jobs:
  transform:
    # The project runner has the Dew toolchain, mise, Node, and Bun installed.
    runs-on: [self-hosted, linux, x64, dewdrop]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check the host adapter
        run: |
          mise exec wasm-tools@1.262.0 -- python3 tools/test-wago-adapter.py
          python3 tools/test-wago-compiler-adapter.py
      - name: Build the compiler and check self-hosting
        run: mise exec wasm-tools@1.262.0 -- tools/check-self-host-bootstrap.sh --fast --through-b
      - name: Compare serial and worker transforms in native Wago
        run: mise exec wasm-tools@1.262.0 -- tools/test-transform-workers.sh .tmp/self-host-bootstrap/b/compiler.wasm
